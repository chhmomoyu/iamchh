        <p class="intro">iamchh 关注用 AI 协助做软件，以及怎样让 Agent 的交付可被验证。正在记录的方向包括：用可执行检查代替口头约定、用短交接文档保住任务状态，以及在有状态切换、分支和时序的逻辑里考虑 TLA+。也在想如何让 AI 不只读代码，还能操作浏览器去验收自己写的功能。</p>
